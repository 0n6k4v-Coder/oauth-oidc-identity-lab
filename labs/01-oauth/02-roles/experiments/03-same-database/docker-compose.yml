services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: lab_roles
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U lab_user -d lab_roles"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  authorization-server:
    build:
      context: ./src/authorization-server
    ports:
      - "8300:8300"
    environment:
      DATABASE_URL: postgresql+psycopg://lab_user:lab_password@db:5432/lab_roles
    depends_on:
      db:
        condition: service_healthy

  resource-server:
    build:
      context: ./src/resource-server
    ports:
      - "8400:8400"
    environment:
      DATABASE_URL: postgresql+psycopg://lab_user:lab_password@db:5432/lab_roles
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./src/client
    ports:
      - "5373:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8400

volumes:
  postgres_data: